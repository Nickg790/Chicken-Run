# Chicken Run — static frontend on Netlify.
# The Socket.io server is NOT here; it runs on Render (see render.yaml) and the
# client finds it via SOCKET_URL at the top of public/game.js.

[build]
  publish = "public"
  command = ""

# Assets are unversioned, so never let a CDN pin a stale game.js after a deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Single page: anything unknown falls back to the game.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
